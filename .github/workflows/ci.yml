name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            apt_package: g++
          - compiler: clang
            cc: clang
            cxx: clang++
            apt_package: clang
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev ${{ matrix.apt_package }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build -LE benchmark --output-on-failure

  sanitize:
    name: ASan+UBSan (Debug, gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev g++

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -LE benchmark --output-on-failure

  benchmarks:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev g++

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run benchmarks
        run: ctest --test-dir build -L benchmark --output-on-failure

  install:
    name: Install + find_package consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev g++

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONICXX_BUILD_TESTS=OFF -DCONICXX_BUILD_BENCHMARKS=OFF -DCONICXX_BUILD_EXAMPLES=OFF
          cmake --build build -j
          cmake --install build --prefix "$PWD/prefix"

      - name: Consumer project
        run: |
          mkdir consumer
          printf 'cmake_minimum_required(VERSION 3.21)\nproject(consumer CXX)\nfind_package(conicxx CONFIG REQUIRED)\nadd_executable(c main.cpp)\ntarget_link_libraries(c conicxx::conicxx)\n' > consumer/CMakeLists.txt
          printf '#include <conicxx/solver.h>\nint main() { conicxx::Solver s; return 0; }\n' > consumer/main.cpp
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build
          ./consumer/build/c
